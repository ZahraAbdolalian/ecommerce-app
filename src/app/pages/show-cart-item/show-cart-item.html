<div class="grid grid-cols-3 grid-cols-[3fr-1fr-1fr]">
    <div class="flex items-center gap-4">
        <img [src]="item().product.imageUrl" class="w-24 h-24 object-cover rounded-lg">

        <div>
            <div class="text-lg font-semibold text-gray-900">{{item().product.name}}</div>
            <div class="text-lg text-gray-600">${{item().product.price}}</div>
        </div>
    </div>

    <app-qty-selector [quantity]="item().quantity"
        (qtyUpdated)="store.setItemQuantity({productId: item().product.id, quantity: $event})" />

    <div class="flex flex-col items-end">
        <div class="text-right text-lg font-semibold">${{total()}}</div>

        <div class="-me-3">
            <button matIconButton (click)="store.moveToWishList(item().product)">
                <mat-icon>favorite_border</mat-icon>
            </button>
            <button matIconButton class="danger" (click)="store.removeFromCart(item().product)">
                <mat-icon>delete</mat-icon>
            </button>
        </div>
    </div>
</div>
